name: Create Release on Tag Push

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release-checks:
    uses: ./.github/workflows/release-checks.yml
    secrets: inherit

  build-and-release:
    needs: release-checks
    runs-on: ubuntu-latest
    environment: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Create keystore from secrets
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_CONTENT" ]; then
            echo "⚠️  Warning: KEYSTORE_FILE secret not found. Building unsigned APK."
            echo "SIGN_APK=false" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_CONTENT" | base64 -d > keystore.jks
            echo "SIGN_APK=true" >> $GITHUB_ENV
          fi

      - name: Extract and update version from tag
        id: version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION_NAME=${TAG_NAME#v}
          
          IFS='.' read -r MAJOR MINOR <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 100 + MINOR))
          
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          echo "Updated to versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_CONTENT" ]; then
            echo "$KEYSTORE_CONTENT" | base64 -d > keystore.jks
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release_apk
          mv app/build/outputs/apk/release/app-release.apk "release_apk/com.sendspinlite.apk"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
        
      - name: Generate changelog from commits
        id: changelog
        run: |
          git fetch --tags --quiet
          python3 .github/scripts/generate_changelog.py \
            --tag "${{ steps.version.outputs.tag_name }}" \
            --version "${{ steps.version.outputs.version_name }}" \
            --sha "${{ github.sha }}"
          cat CHANGELOG.md
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: SendSpin Lite v${{ steps.version.outputs.version_name }}
          body_path: CHANGELOG.md
          files: release_apk/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
